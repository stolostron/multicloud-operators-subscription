apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # ClusterRoleBinding objects are cluster-scoped, so the name must be unique per
  # managed cluster (unlike the namespaced rolebinding.yaml, which gets its
  # per-cluster uniqueness from its namespace). Do NOT use a static name here:
  # this manifest is re-applied once per managed cluster via resourceapply.ApplyDirectly
  # (a declarative create-or-update / full replace), so a shared static name would
  # cause each newly-registered cluster to overwrite the previous cluster's subject,
  # silently revoking the grant for every cluster registered before it.
  name: open-cluster-management:addons:application-manager:cluster-admin-check:{{ .ClusterName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:addons:application-manager:cluster-admin-check
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Group }}
