#
# NetworkPolicies for every Deployment shipped by the "multicluster-operators-subscription" OLM
# bundle's ClusterServiceVersion (multicluster-operators-subscription.clusterserviceversion.yaml).
# This is the production install path that combines controllers built from four repositories:
#   - multicloud-operators-subscription (hub-subscription, standalone-subscription,
#     subscription-report/appsubsummary, and the placementrule container)
#   - multicloud-operators-channel (channel)
#   - multicloud-operators-application (the application webhook container)
#   - multicloud-integrations (the gitopscluster, propagation, gitopssyncresc and
#     multiclusterstatusaggregation containers)
#
# No "namespace" is set on these objects (consistent with the other bundle manifests in this
# directory, e.g. service_metrics_hub_subscription.yaml) so OLM installs them into whatever
# namespace the Subscription/CSV targets.
#
# Design principles (least privilege / deny by default):
#   - Each policy is scoped to a single Deployment's pods via podSelector, so unrelated workloads
#     that also run in the install namespace are never affected.
#   - Once a NetworkPolicy selects a pod, only the traffic explicitly listed below is allowed;
#     everything else is denied by default, per Kubernetes NetworkPolicy semantics.
#   - Every ingress/egress rule carries a short "Allow ..." comment stating exactly what traffic it
#     permits, so each policy can be audited at a glance without cross-referencing port numbers.
#   - DNS, Kubernetes API, metrics-ingress and admission-webhook-ingress rules are all port-based
#     only (no namespaceSelector/podSelector "from"/"to" restriction) for portability:
#       * Prometheus can live in an OpenShift-labeled monitoring namespace or in an arbitrary
#         "monitoring" namespace on non-OpenShift clusters (this project's own docs/metrics.md
#         documents both), neither of which is guaranteed to carry an OpenShift-specific
#         namespace label, so pinning one would silently break scraping in the other environment.
#         Metrics endpoints only expose aggregate operational counters, so the low sensitivity of
#         the data justifies favoring portability, matching backplane-operator's
#         cluster-permission NetworkPolicy, which leaves its own metrics port unrestricted for the
#         same reason.
#       * On managed Kubernetes offerings (EKS, GKE, AKS) the control plane isn't part of the
#         cluster's pod network at all, so kube-apiserver traffic (admission webhook calls) would
#         never match a namespaceSelector/podSelector "from" restriction in the first place; an
#         OpenShift-specific host-network namespace label (as used by multiclusterhub-operator's
#         cluster-backup NetworkPolicy) only helps on OpenShift and is a no-op/breaking
#         restriction elsewhere.
#
# Optional install gate: this file is picked up by the ACM installer automation and merged as-is
# into the multicloud-operators-subscription toggle Helm chart
# (multiclusterhub-operator/pkg/templates/charts/toggle/multicloud-operators-subscription). The
# Helm "if/end" action wrapped around the resources below only has meaning once rendered by that
# chart; it makes installing these NetworkPolicies opt-in there, controlled by the
# global.networkPolicies.enabled value in that chart (see its values.yaml, which defaults this to
# true). Note that once this action is present, this file must be rendered through the Helm
# template engine (e.g. `helm template`) rather than applied directly as plain YAML, since Go's
# text/template scans the whole file - including comments - for its delimiters.
{{- if .Values.global.networkPolicies.enabled }}
---
# multicluster-operators-hub-subscription
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-hub-subscription-policy
spec:
  podSelector:
    matchLabels:
      app: multicluster-operators-hub-subscription
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress
  - ports:
    - protocol: TCP
      port: 8381
  # Allow Git provider (GitHub/GitLab/Bitbucket) webhook events ingress
  - ports:
    - protocol: TCP
      port: 8443
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  # Allow egress to arbitrary Git, Helm repo and S3-compatible object-storage endpoints referenced by Channels
  - {}
---
# multicluster-operators-standalone-subscription
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-standalone-subscription-policy
spec:
  podSelector:
    matchLabels:
      app: multicluster-operators-standalone-subscription
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress
  - ports:
    - protocol: TCP
      port: 8389
  # Allow Git provider (GitHub/GitLab/Bitbucket) webhook events ingress
  - ports:
    - protocol: TCP
      port: 8443
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  # Allow egress to arbitrary Git, Helm repo and S3-compatible object-storage endpoints referenced by Channels
  - {}
---
# multicluster-operators-channel
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-channel-policy
spec:
  podSelector:
    matchLabels:
      app: multicluster-operators-channel
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress
  - ports:
    - protocol: TCP
      port: 8384
  # Allow Channel validating webhook ingress (called directly by kube-apiserver)
  - ports:
    - protocol: TCP
      port: 9443
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  # Allow egress to S3-compatible object-storage endpoints referenced by ObjectBucket-type Channels
  - {}
---
# multicluster-operators-subscription-report (appsubsummary)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-subscription-report-policy
spec:
  podSelector:
    matchLabels:
      app: multicluster-operators-subscription-report
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress
  - ports:
    - protocol: TCP
      port: 8391
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# multicluster-operators-application: one pod with three containers -
#   placementrule (metrics 8383), gitopscluster (metrics 8388), application (metrics 8386,
#   validating/mutating webhook 9442). All three operate purely against the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-operators-application-policy
spec:
  podSelector:
    matchLabels:
      app: multicluster-operators-application
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress (placementrule, gitopscluster, application containers)
  - ports:
    - protocol: TCP
      port: 8383
    - protocol: TCP
      port: 8388
    - protocol: TCP
      port: 8386
  # Allow Application validating/mutating webhook ingress (called directly by kube-apiserver)
  - ports:
    - protocol: TCP
      port: 9442
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# multicluster-integrations: one pod with three containers -
#   propagation (metrics 8386), gitopssyncresc (metrics 8392), multiclusterstatusaggregation
#   (metrics 8383). All three watch Argo CD and OCM ManifestWork objects purely via the
#   Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multicluster-integrations-policy
spec:
  podSelector:
    matchLabels:
      name: multicluster-integrations
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Metrics ingress (propagation, gitopssyncresc, multiclusterstatusaggregation containers)
  - ports:
    - protocol: TCP
      port: 8386
    - protocol: TCP
      port: 8392
    - protocol: TCP
      port: 8383
  egress:
  # Allow DNS egress
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Allow egress to Kubernetes API server
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
{{- end }}
